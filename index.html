<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MANGA">
<meta name="robots" content="noindex">
<title>MANGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela&#43;Gothic&#43;One&amp;family=Russo&#43;One&amp;family=Zen&#43;Kaku&#43;Gothic&#43;New:wght@400;500;700&amp;display=swap">
<style>
 
:root {
  --bg: #f4f3f6; --surface: #ffffff; --fg: #1d1b22; --muted: #6b6775; --line: #dcd9e2;
  --accent: #c2410c; --accent-soft: #fbe7dc; --ok: #15803d; --warn: #a16207; --chip: #ecebf0;
  --display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --logo: "Russo One", "Arial Black", Impact, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141318; --surface: #1d1c22; --fg: #ecebf0; --muted: #9c98a6; --line: #2e2c35;
  --accent: #fb8a4c; --accent-soft: #3a2418; --ok: #4ade80; --warn: #facc15; --chip: #2a2930; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141318; --surface: #1d1c22; --fg: #ecebf0; --muted: #9c98a6; --line: #2e2c35;
  --accent: #fb8a4c; --accent-soft: #3a2418; --ok: #4ade80; --warn: #facc15; --chip: #2a2930; color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; padding: env(safe-area-inset-top, 0px) 16px 40px }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px }
header { display: flex; justify-content: center; padding-block: 18px 4px }
.menu-btn { position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; z-index: 4 }
.menu-btn svg { width: 22px; height: 22px }
.menu { position: absolute; left: 16px; top: calc(62px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .3); z-index: 4 }
.menu[hidden] { display: none }
.menu button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--fg); font: inherit; font-weight: 700; font-size: 1rem; padding: 12px 16px; border-radius: 10px; cursor: pointer; text-align: left; white-space: nowrap }
.menu button:active { background: var(--chip) }
.menu svg { width: 20px; height: 20px; flex: none }
.months { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.months div { font-family: var(--display); font-size: 1.15rem; text-align: center; flex: 1 }
.months button { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 1.4rem; line-height: 1; cursor: pointer }
.months button:disabled { opacity: .3; cursor: default }
 
.pages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; overscroll-behavior-x: contain }
.pages::-webkit-scrollbar { display: none }
.page { flex: 0 0 100%; scroll-snap-align: start; padding-inline: 16px; display: grid; gap: 10px; align-content: start }
.work .w .meta { font-weight: 400 }
h1 { font-family: var(--logo); font-weight: 400; font-size: 1.9rem; line-height: 1; margin: 0; letter-spacing: .06em; text-transform: uppercase }
.notice { background: var(--accent-soft); color: var(--fg); border-radius: var(--radius); padding: 10px 14px; font-size: .88rem }
.notice b { color: var(--accent) }
.tabs { display: flex; gap: 6px }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-weight: 700; padding: 9px 6px; border-radius: 999px; cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.list { display: grid; gap: 10px }
.item { display: grid; grid-template-columns: 60px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; color: inherit; text-decoration: none }
.when { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-variant-numeric: tabular-nums; font-size: .9rem }
.when .d { font-weight: 700 }
.when .left { color: var(--accent); font-weight: 700; font-size: .82rem }
.when .tbd { color: var(--warn); font-size: .82rem }
.info { min-width: 0; display: grid; gap: 4px; align-content: start }
.title { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere }
.title .vol { color: var(--accent); white-space: nowrap }
.meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere }
.memo { color: var(--warn); font-size: .8rem; overflow-wrap: anywhere }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 9px; font-size: .75rem; font-weight: 500 }
.chip.cal { color: var(--ok) } .chip.wait { color: var(--warn) }
.section-label { font-size: .78rem; color: var(--muted); letter-spacing: .08em; font-weight: 700; margin: 6px 2px -4px }
.item.none { opacity: .85 }
.cover { width: 60px; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 4px; border: 1px solid var(--line); object-fit: cover;
  background: linear-gradient(160deg, var(--chip), var(--surface)); display: grid; place-items: center; text-align: center;
  font-size: .62rem; line-height: 1.3; color: var(--muted); padding: 2px }
img.cover { padding: 0 }
@media (max-width: 380px) { .item { grid-template-columns: 52px 1fr; gap: 10px } .cover { width: 52px } }
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px;
  background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 13px 22px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 6px 18px rgb(0 0 0 / .25) }
.fab svg { width: 20px; height: 20px }
.works { display: grid; gap: 8px }
.work { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px }
.work .w { flex: 1; min-width: 0 } .work .w div:first-child { font-weight: 700; overflow-wrap: anywhere }
.work button, .ghost { border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: .82rem; padding: 6px 10px; border-radius: 8px; cursor: pointer; flex: none }
.work button.sure { border-color: var(--accent); color: var(--accent); font-weight: 700 }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: .9rem }
 
.sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; grid-template-columns: minmax(0, 1fr); align-items: end; z-index: 5 }
.sheet[hidden] { display: none }
.panel { background: var(--bg); border-radius: 18px 18px 0 0; max-height: 92%; overflow: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-width: 640px; width: 100%; min-width: 0; margin: 0 auto; overflow-x: hidden; grid-template-columns: minmax(0, 1fr) }
.panel > *, .cand > *, .cand .head > div { min-width: 0 }
.cand .title { overflow-wrap: anywhere }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.1rem; margin: 0 }
.heard { display: grid; gap: 6px }
.heard label { font-size: .8rem; color: var(--muted) }
.listen { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: .9rem }
.listen[hidden] { display: none }
.listen .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none }
@media (prefers-reduced-motion: no-preference) { .listen .dot { animation: blink 1s infinite } @keyframes blink { 50% { opacity: .2 } } }
.heard textarea { font: inherit; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-height: 72px; resize: vertical; width: 100% }
.cand { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px }
.cand .head { display: flex; gap: 10px; align-items: flex-start }
.cand .head img { width: 40px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); flex: none }
.cand input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin-top: 2px }
.state { font-size: .78rem; font-weight: 700 }
.state.ok { color: var(--ok) } .state.pick { color: var(--warn) } .state.miss { color: var(--accent) } .state.dup { color: var(--muted) }
.choices { display: grid; gap: 6px; padding-left: 32px }
.choices label { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; cursor: pointer }
.choices input { accent-color: var(--accent); margin-top: 4px; flex: none }
.fix { display: flex; gap: 6px }
.fix input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.primary { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer }
.primary:disabled, .ghost:disabled { opacity: .5; cursor: default }
.busy { color: var(--muted); font-size: .9rem; text-align: center }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 700; z-index: 9; max-width: calc(100% - 32px); text-align: center }
.updated { color: var(--muted); font-size: .75rem; text-align: center }
@media (prefers-reduced-motion: no-preference) { .panel { animation: up .22s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>MANGA</h1></header>
  <div class="notice" id="notice" hidden></div>
  
  <nav class="months" aria-label="発売月">
    <button id="prev" aria-label="前の月">‹</button>
    <div id="month-title" aria-live="polite">読み込み中…</div>
    <button id="next" aria-label="次の月">›</button>
  </nav>
  <section id="pages" class="pages"></section>
  <div class="updated" id="updated"></div>
  
  <div class="updated"><a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener" style="color:inherit">Supported by Rakuten Developers</a></div>
</div>


<button class="menu-btn" id="menu-btn" aria-label="メニューを開く" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div class="menu" id="menu" hidden>
  <button id="open-mine">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 5.5l3.5 1-3.5 12.5-3.4-1z"/></svg>
    登録した漫画
  </button>
  <button id="open-add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    声で追加
  </button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="sheet-title">
    <h2 id="sheet-title">漫画を追加</h2>
    <div class="heard">
      <div class="listen" id="listen" hidden><span class="dot"></span><span id="listen-text" style="flex:1">聞いています…</span><button class="ghost" id="done-talk" style="color:var(--fg)">話し終わった</button></div>
      <label for="heard">追加したい漫画の題名（いくつか続けて言っても大丈夫です。聞き違いはここで直せます）</label>
      <textarea id="heard" placeholder="例：薬屋のひとりごと、ドラゴンボール超 カラー版"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost" id="find">調べる</button>
        <button class="ghost" id="talk" hidden>もう一度話す</button>
      </div>
    </div>
    <div id="cands" style="display:grid;gap:10px"></div>
    <button class="primary" id="add-all" hidden>チェックした作品をまとめて追加</button>
    <button class="ghost" id="close">閉じる</button>
  </div>
</div>
<div class="sheet" id="mine-sheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="mine-title">
    <h2 id="mine-title">登録した漫画</h2>
    <div id="mine-list" class="works"></div>
    <button class="ghost" id="close-mine">閉じる</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbwQ4Tte-TQbm7sTKCc62LImEsI96nTjKQp3CF_uYV1x4fE519t4k9oFfzr_Vsi4XdrW7w/exec", KEY_NAME = 'manga_key';
  var m = location.hash.match(/k=([0-9a-f]{20,})/), key = null;
  try { if (m) localStorage.setItem(KEY_NAME, m[1]); key = localStorage.getItem(KEY_NAME); } catch (e) {}
  key = key || (m ? m[1] : null);
  window.mangaApi = function(fn, args) {
    if (!key) return Promise.reject(new Error('合言葉がありません。GAS の setup の記録に出たアドレス（#k=… つき）から開いてください'));
    return fetch(API, { method: 'POST', body: JSON.stringify({ key: key, fn: fn, args: args }) })
      
      .then(function(r){ return r.text().then(function(t){
        try { return JSON.parse(t); } catch (e) {
          var title = (t.match(/<title>([^<]*)<\/title>/i) || [])[1] || t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 80);
          throw new Error('サーバーからデータでない返事が来ました（' + r.status + '：' + title + '）。この画面の写真を送ってください');
        }
      }); })
      .then(function(j){
        if (j.ok) return j.result;
        if (j.error === 'auth') { try { localStorage.removeItem(KEY_NAME); } catch (e) {} }
        throw new Error(j.error === 'auth' ? '合言葉が違います。合言葉つきのアドレスから開き直してください' : (j.error || 'エラー'));
      });
  };
})();
</script>
<script>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CACHE = 'manga_list';
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let list = null, cands = [];

function todayJst() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function daysLeft(d) { return Math.round((Date.parse(d) - Date.parse(todayJst())) / 864e5); }

function slash(a) { return String(a || '').split('/').map(s => s.trim().replace(/([^ -~])[\s\u3000]+(?=[^ -~])/g, '$1')).filter(Boolean).join('／'); }
function cover(w, vol) {
  return w.image ? `<img class="cover" src="${esc(w.image)}" alt="第${esc(vol)}巻の表紙" loading="lazy" referrerpolicy="no-referrer">`
    : `<div class="cover" aria-hidden="true">表紙<br>${vol ? '第' + esc(vol) + '巻' : 'なし'}</div>`;
}
function edChip(w) { return `<span class="chip">${w.edition === '電子' ? '電子書籍' : '紙の本'}</span>`; }


function card(w) {
  let when;
  if (w.exact && w.date) {
    const [y, m, d] = w.date.split('-'), left = daysLeft(w.date);
    when = `<div class="when"><span class="d">${y}/${+m}/${+d}${/頃$/.test(w.label) ? '頃' : ''} 発売</span><span class="left">${left > 0 ? 'あと' + left + '日' : left === 0 ? '今日' : ''}</span></div>`;
  } else when = `<div class="when"><span class="d">${esc(w.label)} 発売予定</span><span class="tbd">日にち未定</span></div>`;
  const tag = w.url ? 'a' : 'article', href = w.url ? ` href="${esc(w.url)}" target="_blank" rel="noopener"` : '';
  return `<${tag} class="item"${href}>${cover(w, w.latest || w.volume - 1)}<div class="info">
    <div class="title">${esc(w.name)} <span class="vol">第${esc(w.volume)}巻</span></div>
    ${when}
    <div class="meta">${esc(slash(w.author))}｜${esc(w.publisher)}</div>
    <div class="chips">${edChip(w)}${w.onCalendar ? '<span class="chip cal">カレンダー登録済み</span>' : '<span class="chip wait">日にちが決まったらカレンダーへ</span>'}</div>
    ${w.memo ? `<div class="memo">${esc(w.memo)}</div>` : ''}
  </div></${tag}>`;
}

// 発売月ごとのページ（今月から、発売予定のある月まで）。次の巻が出ていない作品は「登録した漫画」の一覧だけに出す
let months = [], monthAt = 0;
function renderPages() {
  if (!list) return;
  const thisMonth = todayJst().slice(0, 7);
  const byMonth = {};
  list.works.filter(w => w.volume && w.sortKey && w.sortKey < '9999').forEach(w => {
    const k = w.sortKey.slice(0, 7) < thisMonth ? thisMonth : w.sortKey.slice(0, 7);
    (byMonth[k] = byMonth[k] || []).push(w);
  });
  const last = Object.keys(byMonth).sort().pop() || thisMonth;
  months = [];
  for (let [y, m] = thisMonth.split('-').map(Number); `${y}-${String(m).padStart(2, '0')}` <= last; m === 12 ? (y++, m = 1) : m++) months.push(`${y}-${String(m).padStart(2, '0')}`);
  $('pages').innerHTML = months.map(k => {
    const ws = (byMonth[k] || []).sort((a, b) => (a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0));
    return `<div class="page" data-month="${k}">${ws.length ? ws.map(card).join('') : '<div class="empty">この月に発売予定の巻はまだありません。</div>'}</div>`;
  }).join('');
  if (!list.works.length) $('pages').innerHTML = '<div class="page"><div class="empty">登録した漫画がありません。下の「声で追加」から足してください。</div></div>';
  goMonth(Math.min(monthAt, months.length - 1), false);
}
function monthName(k) { const [y, m] = k.split('-'); return `${y}年${+m}月`; }
function showMonth() {
  $('month-title').textContent = months.length ? monthName(months[monthAt]) : '';
  $('prev').disabled = monthAt <= 0; $('next').disabled = monthAt >= months.length - 1;
}
function goMonth(i, smooth) {
  monthAt = Math.max(0, i);
  const p = $('pages').children[monthAt];
  const P = $('pages'), left = p ? p.offsetLeft - P.offsetLeft : 0;
  P.scrollTo({ left, behavior: smooth ? 'smooth' : 'auto' });
  // なめらかに動かす命令が効かない環境もあるので、少し待って届いていなければ直接めくる
  setTimeout(() => { if (Math.abs(P.scrollLeft - left) > 2) P.scrollLeft = left; }, smooth ? 450 : 0);
  showMonth();
}

$('pages').addEventListener('scroll', () => {
  clearTimeout(goMonth.t);
  goMonth.t = setTimeout(() => { const i = Math.round($('pages').scrollLeft / $('pages').clientWidth); if (i !== monthAt) { monthAt = i; showMonth(); } }, 80);
}, { passive: true });
$('prev').onclick = () => goMonth(monthAt - 1, true);
$('next').onclick = () => goMonth(monthAt + 1, true);


function renderMine() {
  if (!list) return;
    $('mine-title').textContent = `登録した漫画（${list.works.length}）`;
  
  
  const NUM = { イチ: 1, ニ: 2, サン: 3, ヨン: 4, ゴ: 5, ロク: 6, ナナ: 7, ハチ: 8 };
  const yomi = w => (w.kana || w.name).replace(/ダイ(イチ|ニ|サン|ヨン|ゴ|ロク|ナナ|ハチ)ブ/g, (_, n) => 'ダイ' + NUM[n] + 'ブ');
  const sorted = list.works.slice().sort((a, b) => yomi(a).localeCompare(yomi(b), 'ja', { numeric: true }));
  $('mine-list').innerHTML = sorted.length ? sorted.map(w => `<div class="work"><div class="w"><div>${esc(w.fullTitle || w.name)}</div>
    <div class="meta">${w.volume ? `第${esc(w.volume)}巻 ${esc(w.label)} 発売予定` : w.checkedAt ? '次の巻はまだ発表されていません' : 'まだ調べていません'}${w.latest ? `｜最新刊 第${esc(w.latest)}巻` : ''}｜${w.edition === '電子' ? '電子書籍' : '紙の本'}</div></div>
    <button data-name="${esc(w.name)}" data-ed="${esc(w.edition)}">登録を外す</button></div>`).join('')
    : '<div class="empty">登録した漫画がありません。</div>';
}
function render() {
  renderPages(); renderMine();
  const t = list && list.works.map(w => w.checkedAt).filter(Boolean).sort().pop();
  $('updated').textContent = t ? `発売日の確認：${t.replace(/-/g, '/')}（毎朝 6 時に自動で確認）` : '';
}
function setList(r) { list = r; store.set(CACHE, JSON.stringify(r)); render(); }
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
function notice(html) { $('notice').innerHTML = html; $('notice').hidden = !html; }

function load() {
  mangaApi('getList', []).then(r => { notice(''); setList(r); }, err => {
    notice(`<b>読み込めませんでした。</b>${esc(err.message)}`);
    if (!list) { $('pages').innerHTML = ''; $('month-title').textContent = ''; }
  });
}

function menu(open) { $('menu').hidden = !open; $('menu-btn').setAttribute('aria-expanded', open); }
$('menu-btn').onclick = e => { e.stopPropagation(); menu($('menu').hidden); };
document.addEventListener('click', e => { if (!$('menu').hidden && !e.target.closest('#menu')) menu(false); });
$('open-mine').onclick = () => { menu(false); $('mine-sheet').hidden = false; };
$('close-mine').onclick = () => { $('mine-sheet').hidden = true; };
$('mine-sheet').addEventListener('click', e => { if (e.target === $('mine-sheet')) $('mine-sheet').hidden = true; });

// 登録を外す：1 回目で「もう一度押すと外します」、2 回目で本当に外す
$('mine-list').addEventListener('click', e => {
  const b = e.target.closest('button[data-name]');
  if (!b) return;
  if (!b.classList.contains('sure')) {
    document.querySelectorAll('#mine-list button.sure').forEach(x => { x.classList.remove('sure'); x.textContent = '登録を外す'; });
    b.classList.add('sure'); b.textContent = 'もう一度押すと外します'; return;
  }
  b.disabled = true; b.textContent = '外しています…';
  mangaApi('removeWork', [b.dataset.name, b.dataset.ed]).then(r => { setList(r); toast(`「${b.dataset.name}」の登録を外しました`); },
    err => { b.disabled = false; b.textContent = '登録を外す'; b.classList.remove('sure'); toast(err.message); });
});

// 追加：題名を調べて、作品ごとの確認の一覧を出す
function candHtml(c, i) {
  const o = c.options || [];
  const desc = x => `${esc(x.name)}（${esc(slash(x.authorFull || x.author))}／${esc(x.publisher)}${x.latest ? '・' + esc(x.latest) + '巻まで' : ''}）`;
  const heardNote = c.heard ? `<div class="meta">「${esc(c.heard)}」と聞こえていました</div>` : '';
  const img = x => x && x.image ? `<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '';
  if (c.state === 'dup') return `<div class="cand"><div class="head"><div><div class="title">${esc(c.dup)}</div>
    <div class="state dup">登録済みです</div>${heardNote}</div></div></div>`;
  if (c.state === 'miss') return `<div class="cand"><div class="head"><div><div class="title">${esc(c.query)}</div>
    <div class="state miss">見つかりませんでした。題名を直して調べてください</div></div></div>
    <div class="fix"><input id="fix${i}" value="${esc(c.query)}" aria-label="題名を直す"><button class="ghost" data-fix="${i}">調べる</button></div></div>`;
  if (c.state === 'ok') { const x = o[0]; return `<div class="cand"><div class="head"><input type="checkbox" id="c${i}" checked aria-label="${esc(x.name)}を追加">${img(x)}<div>
    <div class="title">${esc(x.name)}${x.edition === '電子' ? '（電子書籍）' : ''}</div><div class="meta">${esc(slash(x.authorFull))}｜${esc(x.publisher)}${x.latest ? '｜' + esc(x.latest) + '巻まで発売' : ''}</div>
    <div class="state ok">見つかりました</div>${heardNote}</div></div></div>`; }
  const anyNew = o.some(x => !x.dup);
  return `<div class="cand"><div class="head"><input type="checkbox" id="c${i}"${anyNew ? ' checked' : ' disabled'} aria-label="${esc(c.query)}を追加"><div><div class="title">${esc(c.query)}</div>
    <div class="state pick">いくつか見つかりました。どれですか</div>${heardNote}</div></div>
    <div class="choices">${o.map((x, j) => `<label><input type="radio" name="p${i}" value="${j}"${x.dup ? ' disabled' : ''}${j === o.findIndex(y => !y.dup) ? ' checked' : ''}>${desc(x)}${x.dup ? '　登録済み' : ''}</label>`).join('')}</div></div>`;
}
function renderCands() {
  $('cands').innerHTML = cands.map(candHtml).join('');
  $('add-all').hidden = !cands.some(c => c.state === 'ok' || (c.state === 'pick' && c.options.some(x => !x.dup)));
}
function find(text, at) {
  const btn = at == null ? $('find') : null;
  if (btn) { btn.disabled = true; $('cands').innerHTML = '<div class="busy">調べています…</div>'; $('add-all').hidden = true; }
  return mangaApi('findWorks', [text]).then(r => {
    if (at == null) cands = r; else cands.splice(at, 1, ...r);
    renderCands();
  }, err => { if (btn) $('cands').innerHTML = ''; toast(err.message); }).finally(() => { if (btn) btn.disabled = false; });
}
// 声で追加：押したらすぐ聞き取りを始める（Safari の音声認識）。話し終わったら、文字になった言葉で自動で調べる

const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen() {
  if (!Speech) { setTimeout(() => $('heard').focus(), 50); return; }
  stopListen();
  rec = new Speech();
  
  rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
  $('listen').hidden = false; $('talk').hidden = true; $('heard').value = '';
  $('listen-text').textContent = '聞いています…続けて話せます。話し終わると自動で調べます';
  const r = rec;
  rec.onresult = e => {
    
    $('heard').value = Array.from(e.results).map(x => x[0].transcript.trim()).filter(Boolean).join('、');
    clearTimeout(listen.t);
    listen.t = setTimeout(() => { if (rec === r) { try { r.stop(); } catch (err) {} } }, 2500);
  };
  rec.onerror = e => {
    $('listen-text').textContent = e.error === 'not-allowed' || e.error === 'service-not-allowed'
      ? 'マイクか音声認識が許可されていません。iPhone の「設定」→「Safari」で許可するか、下の欄に書いてください'
      : e.error === 'no-speech' ? '声が聞こえませんでした。「もう一度話す」を押してください' : '聞き取れませんでした（' + e.error + '）';
  };
  rec.onend = () => {
    clearTimeout(listen.t);
    
    r.onresult = r.onerror = r.onend = null;
    try { r.abort(); } catch (err) {}
    rec = null; $('talk').hidden = false;
    const t = $('heard').value.trim();
    if (t) { $('listen').hidden = true; find(t); }
  };
  try { rec.start(); } catch (e) { $('listen').hidden = true; $('talk').hidden = false; }
}

function stopListen() {
  if (!rec) return;
  const r = rec; rec = null;
  r.onresult = r.onerror = r.onend = null;
  try { r.abort(); } catch (e) {}
  $('listen').hidden = true; $('talk').hidden = false;
}

document.addEventListener('visibilitychange', () => { if (document.hidden) stopListen(); });
window.addEventListener('pagehide', stopListen);
$('talk').onclick = () => listen();
$('done-talk').onclick = () => { if (rec) { try { rec.stop(); } catch (e) {} } };
$('open-add').onclick = () => { menu(false); $('sheet').hidden = false; cands = []; $('cands').innerHTML = ''; $('add-all').hidden = true; listen(); };
$('close').onclick = () => { stopListen(); $('sheet').hidden = true; };
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) { stopListen(); $('sheet').hidden = true; } });
$('find').onclick = () => { const t = $('heard').value.trim(); if (t) find(t); else toast('題名を話すか書いてください'); };
$('cands').addEventListener('click', e => {
  const b = e.target.closest('button[data-fix]');
  if (!b) return;
  const i = +b.dataset.fix, t = $('fix' + i).value.trim();
  if (!t) return;
  b.disabled = true; b.textContent = '調べています…';
  find(t, i);
});
$('add-all').onclick = () => {
  const items = [];
  cands.forEach((c, i) => {
    const box = $('c' + i);
    if (!box || !box.checked) return;
    if (c.state === 'ok') items.push(c.options[0]);
    if (c.state === 'pick') { const r = document.querySelector(`input[name="p${i}"]:checked`); if (r) items.push(c.options[+r.value]); }
  });
  if (!items.length) { toast('チェックした作品がありません'); return; }
  const b = $('add-all'); b.disabled = true; b.textContent = '追加して発売日を調べています…';
  mangaApi('addWorks', [items]).then(r => {
    setList(r); cands = []; $('cands').innerHTML = ''; $('heard').value = ''; $('sheet').hidden = true;
    toast(r.added && r.added.length ? `${r.added.length}作品を追加しました` : '追加する作品はありませんでした');
  }, err => toast(err.message)).finally(() => { b.disabled = false; b.textContent = 'チェックした作品をまとめて追加'; });
};

try { const c = JSON.parse(store.get(CACHE) || 'null'); if (c && c.works) { list = c; render(); } } catch (e) {}
load();
</script>
</body>
</html>
